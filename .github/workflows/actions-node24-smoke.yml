name: Actions Node24 smoke
on:
  push:
    branches: [chore/actions-node24]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: 准备小型缓存文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/actions-runtime-smoke | Out-Null
          Set-Content -LiteralPath build/actions-runtime-smoke/fixture.txt -Value 'caors node24 smoke' -Encoding utf8
      - uses: actions/cache@v5
        with:
          path: vendor/cache/sources
          key: ${{ runner.os }}-caors-source-catch2-${{ hashFiles('cmake/caors_dependency_catalog.cmake', 'cmake/caors_dependency_cache.cmake') }}
          fail-on-cache-miss: true
      - uses: actions/cache/save@v5
        with:
          path: build/actions-runtime-smoke/fixture.txt
          key: caors-node24-smoke-${{ runner.os }}-${{ github.run_id }}
      - name: 清除本次测试文件
        shell: pwsh
        run: Remove-Item -LiteralPath build/actions-runtime-smoke/fixture.txt
      - uses: actions/cache/restore@v5
        with:
          path: build/actions-runtime-smoke/fixture.txt
          key: caors-node24-smoke-${{ runner.os }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: 核对缓存内容
        shell: pwsh
        run: |
          if ((Get-Content -Raw -LiteralPath build/actions-runtime-smoke/fixture.txt).Trim() -ne 'caors node24 smoke') { throw 'Cache content mismatch' }
          if (-not (Test-Path vendor/cache/sources/catch2)) { throw 'Dependency source cache missing' }
      - uses: actions/upload-artifact@v6
        with:
          name: node24-smoke-${{ runner.os }}
          path: build/actions-runtime-smoke/fixture.txt
          if-no-files-found: error
          retention-days: 1
