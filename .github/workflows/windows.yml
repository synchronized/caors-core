name: Windows

on:
  workflow_dispatch:
  schedule:
    # 与 Linux 相同，每周一北京时间 02:00。
    - cron: "0 18 * * 0"

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  windows:
    name: ${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-clang-release
            shared: ON
          - preset: windows-msvc-release
            shared: ON
          - preset: windows-clang-static-release
            shared: OFF
    steps:
      - uses: actions/checkout@v5
      - name: 恢复第三方归档与只读源码缓存
        uses: actions/cache@v4
        with:
          path: |
            vendor/cache/archives
            vendor/cache/sources
          key: ${{ runner.os }}-caors-source-${{ hashFiles('cmake/caors_dependency_catalog.cmake', 'cmake/caors_dependency_cache.cmake') }}
      - name: 构建、测试及安装迁移验证
        shell: pwsh
        run: |
          # 包装脚本加载 VS 环境；后续 consumer 在同一进程中使用该环境。
          .\scripts\msvc.ps1 -Preset '${{ matrix.preset }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          cmake `
            -DCAORS_PRODUCER_BUILD_DIR=build/${{ matrix.preset }} `
            -DCAORS_INSTALL_PREFIX=build/installed-package/prefix `
            -DCAORS_CONSUMER_BUILD_DIR=build/installed-package/consumer `
            -DCAORS_RELOCATION_PREFIX=build/installed-package/relocated-prefix `
            -DCAORS_RELOCATED_CONSUMER_BUILD_DIR=build/installed-package/relocated-consumer `
            -DCAORS_BUILD_CONFIG=Release `
            -DCAORS_SHARED=${{ matrix.shared }} `
            -P cmake/caors_verify_installed_package.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 来源快照基准可运行性（不作为性能验收）
        if: matrix.preset == 'windows-msvc-release'
        shell: pwsh
        run: |
          .\scripts\msvc.ps1 -Action configure -Preset windows-msvc-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --preset windows-msvc-release -DCAORS_BUILD_BENCHMARKS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-msvc-release --target caors_provider_snapshot_benchmarks caors_benchmarks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = (Resolve-Path build/windows-msvc-release/src).Path + ';' + $env:PATH
          & build/windows-msvc-release/benchmarks/caors_benchmarks.exe 1 > build/ctrack-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --preset windows-msvc-release -DCAORS_DEPENDENCY_OFFLINE=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/windows-msvc-release/benchmarks/caors_provider_snapshot_benchmarks.exe 3 1000 build/snapshot-smoke-raw.csv > build/snapshot-smoke.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 上传快照基准 smoke 数据
        if: matrix.preset == 'windows-msvc-release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-snapshot-smoke
          path: build/snapshot-smoke*.csv
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-test-log
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
