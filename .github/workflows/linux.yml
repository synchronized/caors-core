name: Linux

on:
  workflow_dispatch:
  schedule:
    # 每周一北京时间 02:00，执行精简常规矩阵。
    - cron: "0 18 * * 0"

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  # 测试会发起不可满足的申请，保持 nothrow 返回空语义。
  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:allocator_may_return_null=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  linux:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-release
            shared: ON
            sanitizer: false
          - preset: linux-gcc-release
            shared: ON
            sanitizer: false
          - preset: linux-clang-asan
            shared: ON
            sanitizer: true
          - preset: linux-clang-ubsan
            shared: ON
            sanitizer: true
          - preset: linux-clang-static-release
            shared: OFF
            sanitizer: false
    steps:
      - uses: actions/checkout@v5
      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang gcc g++
      - name: 记录环境
        run: |
          uname -a
          cmake --version
          ninja --version
          clang --version
          gcc --version
      - name: 配置
        run: cmake --preset "${{ matrix.preset }}"
      - name: 验证无异常协程公共头
        if: matrix.preset == 'linux-clang-static-release' || matrix.preset == 'linux-gcc-release'
        run: |
          compiler=clang++
          case "${{ matrix.preset }}" in linux-gcc-*) compiler=g++ ;; esac
          for probe in tests/tasks/coroutine/no_exceptions_probe.cpp tests/resources/coroutine/no_exceptions_probe.cpp; do
            "$compiler" -std=c++20 -fno-exceptions -DCAORS_FORCE_DISABLE_EXCEPTIONS -DCAORS_STATIC_DEFINE -I include -fsyntax-only "$probe"
          done
      - name: 验证 ASan 覆盖
        if: matrix.preset == 'linux-clang-asan'
        run: python3 scripts/verify_asan_coverage.py build/${{ matrix.preset }}
      - name: 构建
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: 测试
        run: ctest --preset "${{ matrix.preset }}" --timeout 120
      - name: 审计动态库符号与依赖
        if: ${{ !matrix.sanitizer && matrix.shared == 'ON' }}
        run: python3 scripts/verify_shared_symbols.py build/${{ matrix.preset }}/src/libcaors.so build/symbol-audit
      - name: 上传符号与依赖证据
        if: ${{ always() && !matrix.sanitizer && matrix.shared == 'ON' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-symbols
          path: build/symbol-audit/
          if-no-files-found: warn
      - name: 验证安装与迁移 consumer
        if: ${{ !matrix.sanitizer }}
        run: >
          cmake
          -DCAORS_PRODUCER_BUILD_DIR=build/${{ matrix.preset }}
          -DCAORS_INSTALL_PREFIX=build/installed-package/prefix
          -DCAORS_CONSUMER_BUILD_DIR=build/installed-package/consumer
          -DCAORS_RELOCATION_PREFIX=build/installed-package/relocated-prefix
          -DCAORS_RELOCATED_CONSUMER_BUILD_DIR=build/installed-package/relocated-consumer
          -DCAORS_BUILD_CONFIG=Release
          -DCAORS_SHARED=${{ matrix.shared }}
          -P cmake/caors_verify_installed_package.cmake
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-test-log
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
