name: Linux

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  linux-static:
    name: Static · ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-clang-debug
          - linux-clang-release
          - linux-gcc-debug
          - linux-gcc-release
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang gcc g++
      - name: 记录环境
        run: |
          uname -a
          cmake --version
          ninja --version
          clang --version
          gcc --version
          ldd --version
      - name: 配置
        run: cmake --preset "${{ matrix.preset }}"
      - name: 构建
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: 测试
        run: ctest --preset "${{ matrix.preset }}"
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-test-log
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  linux-shared:
    name: Shared · ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-clang-shared-debug
          - linux-clang-shared-release
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang
      - name: 配置
        run: cmake --preset "${{ matrix.preset }}"
      - name: 构建
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: 测试
        run: ctest --preset "${{ matrix.preset }}"
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-test-log
          path: build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  linux-asan:
    name: Shared · Clang ASan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang
      - name: 配置
        run: cmake --preset linux-clang-shared-asan
      - name: 构建
        run: cmake --build --preset linux-clang-shared-asan
      - name: 测试
        run: ctest --preset linux-clang-shared-asan
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-clang-shared-asan-test-log
          path: build/linux-clang-shared-asan/Testing/Temporary/LastTest.log
          if-no-files-found: warn
