name: Linux Stress

on:
  workflow_dispatch:

concurrency:
  group: linux-stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  # try_allocate 测试会故意发起不可满足的超大申请，应保持 nothrow 返回空语义。
  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:allocator_may_return_null=1

jobs:
  linux-stress:
    name: Shared · Clang ASan Stress
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: 恢复第三方归档与只读源码缓存
        uses: actions/cache@v5
        with:
          path: |
            vendor/cache/archives
            vendor/cache/sources
          # 按依赖集合分键，避免只含 Catch2 的快任务占据完整基准缓存键。
          key: ${{ runner.os }}-caors-source-catch2-${{ hashFiles('cmake/caors_dependency_catalog.cmake', 'cmake/caors_dependency_cache.cmake') }}
      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build clang
      - name: 记录环境
        run: |
          uname -a
          cmake --version
          ninja --version
          clang --version
          gcc --version
          ld --version
          ldd --version
          g++ -print-file-name=libstdc++.so
      - name: 配置
        run: cmake --preset linux-clang-asan
      - name: 验证 ASan 覆盖
        run: python3 scripts/verify_asan_coverage.py build/linux-clang-asan
      - name: 构建
        run: cmake --build --preset linux-clang-asan
      - name: 插件卸载压力测试
        run: >-
          ctest --test-dir build/linux-clang-asan
          --output-on-failure
          --repeat until-fail:20
          -R '^(caors\.plugins\.(scope|protocol|resource_lifetime)|caors\.meta\.plugin_identity)$'
      - name: 临时内存与 MessagePack 压力测试
        run: >-
          ctest --test-dir build/linux-clang-asan
          --output-on-failure
          --repeat until-fail:10
          -R '^(caors\.memory\.|caors\.serialization\.messagepack$)'
      - name: VFS 与异步加载压力测试
        run: >-
          ctest --test-dir build/linux-clang-asan
          --output-on-failure
          --repeat until-fail:20
          -R '^(caors\.io|caors\.assets\.asset_manager|caors\.resources\.(async|provider))$'
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-clang-asan-stress-test-log
          path: build/linux-clang-asan/Testing/Temporary/LastTest.log
          if-no-files-found: warn
